name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tests/requirements.txt
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet format style --no-restore --verify-no-changes --diagnostics IDE0011
      - run: dotnet test -c Release --no-restore
        env:
          PAPERLESS_TEST_PYTHON: python
      - run: dotnet publish src/ProtonBridgeBridge -c Release --no-restore -o artifacts/ProtonBridgeBridge /p:UseAppHost=false
      - run: docker build -t proton-bridge-bridge:test .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ProtonBridgeBridge-review-build
          path: artifacts/ProtonBridgeBridge
